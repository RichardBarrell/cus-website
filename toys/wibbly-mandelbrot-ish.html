<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Wibbly thing akin to a Mandelbröt</title>
    <style type="text/css">
      html {
        height: 100%;
      }
      body {
        background: #ddd;
        height: 100%;
        margin: 0;
        padding: 0;
      }
      main {
        box-sizing: border-box;
        padding: 10px;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      main > canvas {
        width: 100%;
        height: 100%;
      }
      #fractal-controls {
        background: white;
        position: fixed;
        top: 25px;
        right: 25px;
        padding: 10px 20px;
        opacity: 0.6;
      }
      #fractal-controls:hover {
        opacity: 1;
      }
      .control label {
        display: inline-block;
        margin: 3px 5px;
      }
      .control input {
        float: right;
        margin: 0 5px;
      }
      .control button {
        display: block;
        margin: 1px 5px 3px auto;
      }
      .control {
        width: 100%;
        border: 1px solid pink;
        padding: 2px;
      }
      .control:after {
        content: "";
        clear: both;
      }
    </style>
  </head>
  <body>
    <main id="main">
      <div id="fractal-controls">
        <button type="button" id="start_rendering">(re)start</button>
        <button type="button" id="stop_rendering">stop</button>
        <div class="control">
          <label for="fractal-wibbly">Wibbliness:</label>
          <input
            type="range"
            id="fractal-wibbly"
            min="0"
            max="100"
            value="30"
          />
        </div>
        <div class="control">
          <label for="fractal-boat">Boatometer:</label>
          <input type="range" id="fractal-boat" min="0" max="100" value="0" />
        </div>
        <div class="control">
          <label for="fractal-zoom">Zoom:</label>
          <input
            type="range"
            id="fractal-zoom"
            min="-2"
            max="3"
            value="0"
            step="0.01"
          />
        </div>
        <div class="control">
          <label for="fractal-speed">Speed:</label>
          <input type="range" id="fractal-speed" min="1" max="100" value="50" />
        </div>
        <div class="iterations">
          <label for="fractal-iterations">Iterations:</label>
          <input type="number" id="fractal-iterations" min="1" max="256" step="1" value="16" />
        </div>
        <ul id="messages"></ul>
      </div>
    </main>

    <script type="text/javascript">
      // <!--
      const messages = document.getElementById("messages");
      const main = document.getElementById("main");
      let t0 = Date.now();
      function pageLog(message) {
        const t = Date.now();
        const li = document.createElement("li");
        message = String(message);
        message = String(t - t0) + "ms " + message;
        li.textContent = message;
        messages.appendChild(li);
        t0 = t;
      }
      let canvas = null;
      let canvasBox = null;
      function handleResizeCanvas() {
        if (canvas == null) return;
        canvasBox = canvas.getBoundingClientRect();
        const ratio = window.devicePixelRatio || 1.0;
        canvas.width = Math.floor(canvasBox.width * ratio);
        canvas.height = Math.floor(canvasBox.height * ratio);
      }
      window.addEventListener("resize", handleResizeCanvas);

      const controls = document.getElementById("fractal-controls");
      function toggleControlsVisibility(event) {
        if (controls.style.display === "none") {
          controls.style.display = "block";
        } else {
          controls.style.display = "none";
        }
      }
      controls.addEventListener(
        "click",
        (event) => {
          event.stopPropagation();
        },
        false,
      );
      document
        .getElementById("start_rendering")
        .addEventListener("click", startRendering, false);
      document
        .getElementById("stop_rendering")
        .addEventListener("click", stopRendering, false);
      let anim_timeout = null;

      const input_wibbly = document.getElementById("fractal-wibbly");
      const input_speed = document.getElementById("fractal-speed");
      const input_zoom = document.getElementById("fractal-zoom");
      const input_boat = document.getElementById("fractal-boat");
      const input_iterations = document.getElementById("fractal-iterations");

      let iterationCount = parseInt(input_iterations.value, 10);
      input_iterations.addEventListener("change", event => {
        const newIterationCount = parseInt(input_iterations.value, 10);
        if (Math.floor(newIterationCount) !== newIterationCount) return;
        if (!(newIterationCount > 0)) return;
        iterationCount = newIterationCount;
        startRendering();
      }, false);

      let zoom = 1;
      const setZoom = () => {
        zoom = Math.pow(10, parseFloat(input_zoom.value));
      };
      setZoom();
      input_zoom.addEventListener("input", setZoom);
      let wibbly = parseFloat(input_wibbly.value);
      input_wibbly.addEventListener("input", event => {
        wibbly = parseFloat(input_wibbly.value);
      });
      let speed = parseFloat(input_speed.value);
      input_speed.addEventListener("input", event => {
        speed = parseFloat(input_speed.value);
      });
      let boatiness = parseFloat(input_boat.value);
      input_boat.addEventListener("input", event => {
        boatiness = parseFloat(input_boat.value);
      });

      let xoff = 0.0;
      let yoff = 0.0;

      let mouseIsDown = false;
      let lastX = 0.0, lastY = 0.0;
      let movement = 0.0;
      function moveForMouseEvent(event) {
        if (!canvasBox) return;
        xoff -= (event.pageX - lastX) * 100 / canvasBox.width / zoom;
        yoff -= (event.pageY - lastY) * 100 / canvasBox.height / zoom;
        movement += Math.sqrt(
          (event.pageX - lastX)**2 +
          (event.pageY - lastY)**2
        );
        lastX = event.pageX;
        lastY = event.pageY;
      }
      function handleMouseDown(event) {
        if (event.target !== canvas) return;
        event.preventDefault();
        mouseIsDown = true;
        lastX = event.pageX;
        lastY = event.pageY;
        movement = 0;
        main.addEventListener('mousemove', handleMouseMove);
        main.addEventListener('mouseup', handleMouseUp, false);
      }
      function handleMouseMove(event) {
        if (mouseIsDown) moveForMouseEvent(event);
      }
      function handleMouseUp(event) {
        if (mouseIsDown) moveForMouseEvent(event);
        mouseIsDown = false;
        main.removeEventListener('mousemove', handleMouseMove);
        main.removeEventListener('mouseup', handleMouseUp, false);
        if (movement < 3.0) {
          toggleControlsVisibility();
        }
      }

      function handleWheel(event) {
        if (event.target !== canvas) return;
        let deltaY = event.deltaY;
        if (event.deltaMode === event.DOM_DELTA_LINE) deltaY /= 10.0;
        if (![event.DOM_DELTA_LINE, event.DOM_DELTA_PIXEL].includes(event.deltaMode))
          return;
        input_zoom.value = parseFloat(input_zoom.value) + deltaY * 5e-4;
        setZoom();
      }

      main.addEventListener('mousedown', handleMouseDown, false);
      main.addEventListener('wheel', handleWheel, false);
      main.addEventListener('mousewheel', handleWheel, false);

      function startRendering() {
        messages.innerHTML = '';
        if (canvas != null) {
          canvas.parentElement.removeChild(canvas);
        }
        canvas = document.createElement("canvas");
        canvas.setAttribute("alt", "A fractal");
        main.appendChild(canvas);

        handleResizeCanvas();
        stopRendering();
        const gl = canvas.getContext("webgl", {
          failIfMajorPerformanceCaveat: true,
          antialias: false,
          alpha: false,
          depth: false,
          stencil: false,
        });
        pageLog("Created WebGL context");

        var fill_tri = new Float32Array([0, 0, 0, 2, 2, 0]);

        var v_shader_text = `
attribute vec2 coord2d;
varying vec2 uv;
uniform float time;
varying vec2 circle;
void main(void) {
 uv = (2.0 * coord2d.xy) - 1.0;
 gl_Position = vec4(uv, 0.0, 1.0);
 circle = vec2(sin(time), cos(time));
}`;

        var v_s = gl.createShader(gl.VERTEX_SHADER);
        gl.shaderSource(v_s, v_shader_text);
        gl.compileShader(v_s);
        const v_log = gl.getShaderInfoLog(v_s);
        if (v_log) pageLog("vertex shader: " + v_log);

        var f_shader_text = `
precision mediump float;
varying vec2 circle;
varying vec2 uv;
uniform float wibbly;
uniform float zoom;
uniform float xoff;
uniform float yoff;
uniform float boat;

vec2 cmul(vec2 a, vec2 b) {
 return vec2(
   a.x * a.x - b.y * b.y,
   a.x * b.y + a.y * b.x);
}

void main(void) {
 vec2 a = wibbly * circle / 100.0;
 vec2 c = (1.0 / zoom) * vec2(uv.x - 0.5, 0.0 - uv.y);
 c.x += xoff / 50.0;
 c.y += yoff / 50.0;
 for (int i = 0; i < ${iterationCount}; i++) {
  a = cmul(a, a) + c;
  a = vec2(mix(a.x, abs(a.x), boat), mix(a.y, abs(a.y), boat));
  if (length(a) > 4.0) break;
 }
 float m = length(a);
 m = 1.0 - pow(m / 16.0, 0.2);
 gl_FragColor[0] = 0.0;
 gl_FragColor[1] = m;
 gl_FragColor[2] = (m + uv.y * 0.3) / 1.3;
 gl_FragColor[3] = 1.0;
}`;

        var f_s = gl.createShader(gl.FRAGMENT_SHADER);
        gl.shaderSource(f_s, f_shader_text);
        gl.compileShader(f_s);
        const f_log = gl.getShaderInfoLog(f_s);
        if (f_log) pageLog("fragment shader: " + f_log);

        var prog = gl.createProgram();
        gl.attachShader(prog, v_s);
        gl.attachShader(prog, f_s);
        gl.linkProgram(prog);
        if (gl.getError()) {
          pageLog("Problem compiling shaders: " + gl.getProgramInfoLog(prog));
          return;
        }

        pageLog("Compiled shaders");

        var vbo = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, vbo);
        gl.bufferData(gl.ARRAY_BUFFER, fill_tri, gl.STATIC_DRAW);
        var coord2d_loc = gl.getAttribLocation(prog, "coord2d");

        let tLast = performance.now();
        let fractalTime = 0.0;
        let first_frame = true;

        function redisplay() {
          if (gl.isContextLost()) {
            pageLog("WebGL context lost.");
            return;
          }
          const tNow = performance.now();
          fractalTime = (fractalTime + 1.0e-3 * (tLast - tNow) * (speed / 50.0)) % (Math.PI);
          tLast = tNow;
          gl.viewport(0, 0, gl.canvas.width, gl.canvas.height);
          gl.clearColor(0.5, 1.0, 1.0, 1.0);
          gl.clear(gl.COLOR_BUFFER_BIT);
          gl.useProgram(prog);
          gl.uniform1f(gl.getUniformLocation(prog, "time"), fractalTime);
          gl.uniform1f(
            gl.getUniformLocation(prog, "wibbly"),
            wibbly,
          );
          gl.uniform1f(
            gl.getUniformLocation(prog, "zoom"),
            zoom,
          );
          gl.uniform1f(
            gl.getUniformLocation(prog, "xoff"),
            xoff,
          );
          gl.uniform1f(
            gl.getUniformLocation(prog, "yoff"),
            yoff,
          );
          gl.uniform1f(
            gl.getUniformLocation(prog, "boat"),
            boatiness,
          );
          gl.enableVertexAttribArray(coord2d_loc);
          gl.vertexAttribPointer(coord2d_loc, 2, gl.FLOAT, gl.FALSE, 0, 0);
          gl.drawArrays(gl.TRIANGLES, 0, fill_tri.length / 2);
          gl.disableVertexAttribArray(coord2d_loc);
          anim_timeout = window.requestAnimationFrame(redisplay);
          if (first_frame) {
            pageLog("Displayed first frame");
            first_frame = false;
          }
        }
        redisplay();
      }

      function stopRendering() {
        if (anim_timeout != null) {
          window.cancelAnimationFrame(anim_timeout);
        }
        anim_timeout = null;
      }

      startRendering();
      // -->
    </script>
  </body>
</html>
